<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto-Cashflip - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="css/responsivo.css" rel="stylesheet" />
    <script src="js/api-config.js"></script>
    <style>
      .btn-cornalina { background-color: #B31B1B; color: white; border: none; }
      .btn-cornalina:hover { background-color: #8a1515; color: white; }
    </style>
  </head>
  <body class="bg-black">
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-secondary">
      <div class="container-fluid">
        <a class="navbar-brand text-white" href="index.html">Cashflip</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          </ul>
        </div>
      </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="card bg-dark shadow-lg border-0" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5">
          <h2 class="text-center mb-4">Acesse sua conta</h2>
          <form id="formLogin">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="mb-4">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" placeholder="••••••••" required>
            </div>
            <div class="d-flex justify-content-between mb-4">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="lembrar">
                <label class="form-check-label text-secondary" for="lembrar">Lembrar-me</label>
              </div>
              <a href="#" class="text-decoration-none" style="color: #B31B1B;">Esqueci a senha</a>
            </div>
            <button type="submit" class="btn btn-cornalina w-100 py-2">Entrar</button>
            <p id="mensagem" class="text-center mt-3"></p>
          </form>
          <hr class="border-secondary my-4">
          <p class="text-center text-secondary mb-2">Ainda não tem conta pessoal?</p>
          <a href="cadastro-pessoal.html" class="btn btn-outline-light w-100 mb-3">Criar conta de pessoa física</a>
          <p class="text-center text-secondary mb-2">Acessando como empresa?</p>
          <a href="login-empresarial.html" class="btn btn-outline-light w-100">Login empresarial</a>
        </div>
      </div>
    </div>
    <script src="js/comandologin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
