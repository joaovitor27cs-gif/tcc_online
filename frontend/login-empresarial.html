<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashflip - Acesso empresarial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="css/responsivo.css" rel="stylesheet" />
    <script src="js/api-config.js"></script>
    <style>
      .btn-cornalina { background-color: #b31b1b; color: white; border: none; }
      .btn-cornalina:hover { background-color: #941616; color: white; }
      .cartao-login { max-width: 500px; background-color: #212529; }
      .cartao-login .card-body { padding: 56px 60px; }
      .titulo-login { font-size: 2.5rem; }
      .form-control { padding: 10px 14px; }
      .btn-entrar { padding: 12px; }
      @media (max-width: 575.98px) {
        .cartao-login .card-body { padding: 36px 28px; }
        .titulo-login { font-size: 2rem; }
      }
    </style>
  </head>
  <body class="bg-black">
    <nav class="navbar bg-dark border-bottom border-secondary">
      <div class="container-fluid">
        <a class="navbar-brand text-white" href="index.html">Cashflip</a>
        <a class="nav-link" href="login.html">Acesso pessoal</a>
      </div>
    </nav>

    <main class="container d-flex justify-content-center align-items-center py-5" style="min-height: calc(100vh - 57px);">
      <section class="card cartao-login shadow-lg border-0 w-100">
        <div class="card-body">
          <h1 class="titulo-login text-center mb-4">Acesse sua conta</h1>
          <div id="mensagemEmpresa" class="alert d-none" role="alert"></div>

          <div class="tab-content">
            <div class="tab-pane fade show active" id="painelLogin" role="tabpanel" aria-labelledby="tabLogin">
              <form id="formLoginEmpresa">
                <div class="mb-3">
                  <label for="emailLogin" class="form-label">E-mail</label>
                  <input type="email" id="emailLogin" class="form-control" placeholder="seu@email.com" autocomplete="username" required>
                </div>
                <div class="mb-4">
                  <label for="senhaLogin" class="form-label">Senha</label>
                  <input type="password" id="senhaLogin" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="lembrarEmpresa">
                    <label class="form-check-label text-secondary" for="lembrarEmpresa">Lembrar-me</label>
                  </div>
                  <a href="#" id="linkEsqueciSenha" class="text-decoration-none text-danger">Esqueci a senha</a>
                </div>
                <button type="submit" id="botaoLoginEmpresa" class="btn btn-cornalina btn-entrar w-100">Entrar</button>
              </form>
              <hr class="border-secondary my-4">
              <p class="text-center text-secondary mb-2">Ainda não possui uma conta empresarial?</p>
              <button class="btn btn-outline-light w-100" id="tabCadastro" type="button" role="tab" aria-controls="painelCadastro" aria-selected="false">Cadastrar empresa</button>
            </div>

            <div class="tab-pane fade" id="painelCadastro" role="tabpanel" aria-labelledby="tabCadastro">
              <h2 class="h4 text-center mb-4">Cadastre sua empresa</h2>
              <form id="formCadastroEmpresa">
                <div class="mb-3">
                  <label for="nomeEmpresa" class="form-label">Nome da empresa</label>
                  <input type="text" id="nomeEmpresa" class="form-control" maxlength="120" autocomplete="organization" required>
                </div>
                <div class="mb-3">
                  <label for="emailCadastro" class="form-label">E-mail</label>
                  <input type="email" id="emailCadastro" class="form-control" autocomplete="email" required>
                </div>
                <div class="mb-4">
                  <label for="senhaCadastro" class="form-label">Senha (mínimo 8 caracteres)</label>
                  <input type="password" id="senhaCadastro" class="form-control" minlength="8" autocomplete="new-password" required>
                </div>
                <button type="submit" id="botaoCadastroEmpresa" class="btn btn-cornalina btn-entrar w-100">Cadastrar empresa</button>
              </form>
              <hr class="border-secondary my-4">
              <p class="text-center text-secondary mb-2">Já possui uma conta empresarial?</p>
              <button class="btn btn-outline-light w-100" id="tabLogin" type="button" role="tab" aria-controls="painelLogin" aria-selected="true">Voltar para entrar</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/login-empresarial.js"></script>
  </body>
</html>
