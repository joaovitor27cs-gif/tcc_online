<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashflip - Recebimentos empresariais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="css/responsivo.css" rel="stylesheet" />
    <script src="js/api-config.js"></script>
    <style>
      .btn-cornalina { background-color: #B31B1B; color: white; border: none; }
      .btn-cornalina:hover { background-color: #8a1515; color: white; }
    </style>
  </head>
  <body class="bg-black">
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-secondary">
      <div class="container-fluid">
        <a class="navbar-brand text-white" href="inicial.html">Cashflip</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarRecebimentos" aria-controls="navbarRecebimentos" aria-expanded="false" aria-label="Abrir navegação">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarRecebimentos">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="despesas.html">Despesas</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="recebimentos.html">Recebimentos</a></li>
            <li class="nav-item"><a class="nav-link" href="grafico.html">Gráficos</a></li>
            <li class="nav-item"><a id="linkAssistenteEmpresa" class="nav-link d-none" href="assistente-empresarial.html">Assistente IA</a></li>
          </ul>
          <span id="nomeEmpresa" class="navbar-text me-3"></span>
          <a id="linkSair" class="nav-link" href="index.html">Sair</a>
        </div>
      </div>
    </nav>

    <main class="container mt-5">
      <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="card bg-dark border-0 h-100"><div class="card-body">
          <div class="small text-secondary">Total de recebimentos</div><div id="totalRecebimentos" class="fs-4 fw-bold">—</div>
        </div></div></div>
        <div class="col-md-4"><div class="card bg-dark border-0 h-100"><div class="card-body">
          <div class="small text-secondary">Total de despesas</div><div id="totalDespesas" class="fs-4 fw-bold text-danger">—</div>
        </div></div></div>
        <div class="col-md-4"><div class="card bg-dark border-0 h-100"><div class="card-body">
          <div class="small text-secondary">Saldo (recebimentos - despesas)</div><div id="saldoEmpresa" class="fs-4 fw-bold text-success">—</div>
        </div></div></div>
      </div>

      <section class="card bg-dark shadow-lg border-0 mb-4">
        <div class="card-body">
          <h1 class="h4 mb-4">Gerenciar recebimentos</h1>
          <div id="mensagemRecebimentos" class="alert d-none" role="alert"></div>
          <form id="formRecebimento" class="row g-3 mb-4 border-bottom border-secondary pb-4">
            <div class="col-md-3">
              <label for="descricaoRecebimento" class="form-label">Descrição</label>
              <input type="text" id="descricaoRecebimento" class="form-control" placeholder="Ex.: Venda de produto" maxlength="200" required>
            </div>
            <div class="col-md-3">
              <label for="origemRecebimento" class="form-label">Cliente / origem</label>
              <input type="text" id="origemRecebimento" class="form-control" placeholder="Ex.: Cliente ou contrato" maxlength="160" required>
            </div>
            <div class="col-md-2">
              <label for="valorRecebimento" class="form-label">Valor (R$)</label>
              <input type="number" id="valorRecebimento" class="form-control" min="0.01" step="0.01" placeholder="0,00" required>
            </div>
            <div class="col-md-2">
              <label for="dataRecebimento" class="form-label">Data</label>
              <input type="date" id="dataRecebimento" class="form-control" required>
            </div>
            <div class="col-md-2">
              <label for="statusRecebimento" class="form-label">Status</label>
              <select id="statusRecebimento" class="form-select" required>
                <option value="Pendente">Pendente</option>
                <option value="Pago">Recebido</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end gap-2">
              <button id="botaoSalvarRecebimento" type="submit" class="btn btn-cornalina flex-grow-1">Cadastrar recebimento</button>
              <button id="botaoCancelarRecebimento" type="button" class="btn btn-outline-light d-none">Cancelar</button>
            </div>
          </form>

          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
              <thead><tr>
                <th>Descrição</th><th>Cliente / origem</th><th>Data</th><th>Valor</th><th>Status</th><th class="text-end">Ações</th>
              </tr></thead>
              <tbody id="tabelaRecebimentos">
                <tr><td colspan="6" class="text-secondary text-center">Carregando recebimentos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/recebimentos.js"></script>
    <script src="js/notificacoes.js" data-modo="empresarial"></script>
  </body>
</html>
